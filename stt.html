<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VoxKey Speech Bridge</title>
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="status" style="display:none;"></div>
  <div id="log" style="display:none;"></div>

  <script>
    // VoxKey speech bridge. Runs in a small Chrome window (Electron has no speech recognition).
    // VoxKey sends {command: 'start', lang} and {command: 'stop'}; this page answers with
    // status / speech_result / speech_error / bridge_state / audio_level messages.
    // See docs/architecture.md.
    //
    // Chrome delivers no speech results while this page is hidden. VoxKey starts Chrome with options
    // that keep a covered window "visible"; if the page is still hidden (for example minimized), it
    // refuses to start and says so, instead of pretending to listen.

    // Keep the window out of sight
    try {
      window.moveTo(-10000, -10000);
      window.resizeTo(1, 1);
    } catch (e) {}

    let ws;
    let recognition = null;
    let isListening = false; // the user wants to dictate (between "start" and "stop")
    let currentLang = 'en-US';

    // Errors after which Chrome simply restarts listening; they are not worth telling the user.
    const QUIET_ERRORS = ['no-speech', 'aborted'];

    // ---- Audio level reporting ------------------------------------------------------------------
    // While listening, the microphone is also measured, so the keyboard can show live levels and
    // VoxKey can stop after silence. If any part of this fails, dictation still works; VoxKey then
    // falls back to speech results to detect silence.
    let micStream = null;
    let audioCtx = null;
    let analyser = null;
    let levelTimer = null;

    function stopTracks(stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
    }

    function rmsLevel(buf) {
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = (buf[i] - 128) / 128;
        sum += v * v;
      }
      return Math.sqrt(sum / buf.length);
    }

    function startAudioLevels() {
      if (levelTimer) return;
      if (typeof navigator === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        if (!isListening || levelTimer) {
          stopTracks(stream);
          return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) {
          stopTracks(stream);
          return;
        }
        micStream = stream;
        audioCtx = new AudioCtx();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        if (audioCtx.resume) audioCtx.resume().catch(function () {});
        const buf = new Uint8Array(analyser.fftSize);
        levelTimer = setInterval(function () {
          if (!analyser) return;
          analyser.getByteTimeDomainData(buf);
          send({ type: 'audio_level', level: Math.min(1, rmsLevel(buf) * 3) });
        }, 100);
      }).catch(function () {
        // No level data; dictation works without it.
      });
    }

    function stopAudioLevels() {
      if (levelTimer) {
        clearInterval(levelTimer);
        levelTimer = null;
      }
      if (micStream) {
        stopTracks(micStream);
        micStream = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch (e) {}
        audioCtx = null;
      }
      analyser = null;
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    function initRecognition() {
      // One recognizer for the life of the page. A WebSocket reconnect must not create a second one.
      if (recognition) return;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.error('Web Speech API not supported.');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.lang = currentLang;

      recognition.onstart = () => {
        send({ type: 'status', status: 'listening' });
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const item = event.results[i];
          if (item.isFinal) finalTranscript += item[0].transcript;
          else interimTranscript += item[0].transcript;
        }
        send({ type: 'speech_result', interim: interimTranscript, final: finalTranscript });
      };

      recognition.onerror = (event) => {
        if (QUIET_ERRORS.includes(event.error)) return;
        // A real problem (microphone not allowed, network, ...): stop and tell VoxKey.
        isListening = false;
        send({ type: 'speech_error', error: event.error });
      };

      recognition.onend = () => {
        if (isListening) {
          // Chrome ends recognition after a pause or after about a minute; keep listening.
          try {
            recognition.start();
            return;
          } catch (e) {}
        }
        isListening = false;
        send({ type: 'status', status: 'idle' });
      };
    }

    function startListening(lang) {
      // Chrome applies recognition.lang only when a session starts, not while one runs.
      const langChanged = Boolean(lang) && lang !== currentLang;
      if (lang) {
        currentLang = lang;
        if (recognition) recognition.lang = currentLang;
      }
      if (document.hidden) {
        send({ type: 'speech_error', error: 'page-hidden' });
        return;
      }
      if (!recognition) {
        send({ type: 'speech_error', error: 'not-supported' });
        return;
      }
      isListening = true;
      startAudioLevels(); // runs beside recognition; failure there must not stop dictation
      try {
        recognition.start();
      } catch (err) {
        if (langChanged) {
          // Already running in the old language. End the session; onend restarts listening,
          // and the new session runs with the new recognition.lang.
          try { recognition.stop(); } catch (e) {}
        } else {
          // Already running (for example after a reconnect): confirm instead of failing.
          send({ type: 'status', status: 'listening' });
        }
      }
    }

    function stopListening() {
      isListening = false;
      stopAudioLevels();
      try {
        if (recognition) recognition.stop();
      } catch (err) {}
    }

    document.addEventListener('visibilitychange', () => {
      send({ type: 'bridge_state', visible: !document.hidden });
    });

    function connectWS() {
      const host = window.location.host || '127.0.0.1:19876';
      ws = new WebSocket('ws://' + host);

      ws.onopen = () => {
        initRecognition();
        send({ type: 'bridge_state', visible: !document.hidden });
      };

      ws.onmessage = (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (e) {
          console.error('Message parse error:', e);
          return;
        }
        if (msg.command === 'start') startListening(msg.lang);
        else if (msg.command === 'stop') stopListening();
      };

      ws.onclose = () => {
        setTimeout(connectWS, 1500);
      };
    }

    window.onload = connectWS;
  </script>
</body>
</html>
