name: Release

# Builds installers for macOS and Windows when a version tag (for example v0.1.0) is pushed,
# and attaches them to a draft GitHub release. Publish the draft to make it the latest release;
# installed copies of VoxKey then find the update. Code signing is not set up yet.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the draft release once, before the build jobs. Without this, the macOS and Windows jobs both
  # found no release and each created its own draft (this happened for v0.1.1).
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "VoxKey ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."

  package:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      # Build the Windows helper from source, so the released binary matches native/injector.cs.
      - if: runner.os == 'Windows'
        run: npm run build:injector
      # Build the macOS key-state helper, for hold-to-talk and modifier shortcuts.
      - if: runner.os == 'macOS'
        run: npm run build:keyhelper
      - run: npm test
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
