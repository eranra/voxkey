name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      # Compile the Windows keystroke helper from source, so the code in native/ is known to build.
      - if: runner.os == 'Windows'
        run: npm run build:injector
      - name: Build the Windows key-state helper from source
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe" /target:exe /out:bin\\keystate-windows.exe native\\keystate.cs
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: injector-exe
          path: bin/injector.exe
      - run: npm run lint
      - run: npm test
      # Build the app folder (no installer), to catch packaging errors before a release.
      - run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
