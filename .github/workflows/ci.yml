name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      # Compile the Windows keystroke helper from source, so the code in native/ is known to build.
      - if: runner.os == 'Windows'
        run: npm run build:injector
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: injector-exe
          path: bin/injector.exe
      - run: npm run lint
      - run: npm test
      # Build the app folder (no installer), to catch packaging errors before a release.
      - run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
