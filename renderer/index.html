<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>VoxKey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="voxkey-container">
    <!-- Drag Handle / Header -->
    <div class="voxkey-header" id="drag-region">
      <div class="header-left">
        <div class="app-logo" id="app-logo" title="About VoxKey">
          <img src="../assets/tray@2x.png" width="22" height="22" alt="VoxKey" class="logo-img" />
        </div>
        <div class="voice-transcript-box" id="transcript-box">
          <span class="transcript-placeholder" id="transcript-placeholder">Tap mic or press F8 to dictate...</span>
          <span class="transcript-interim" id="transcript-interim"></span>
        </div>
      </div>

      <div class="header-right">
        <!-- Language selector -->
        <select id="lang-select" class="lang-dropdown">
          <option value="en-US" selected>EN (US)</option>
          <option value="en-GB">EN (UK)</option>
          <option value="es-ES">ES</option>
          <option value="fr-FR">FR</option>
          <option value="de-DE">DE</option>
          <option value="he-IL">HE</option>
          <option value="ar-SA">AR</option>
          <option value="ru-RU">RU</option>
          <option value="zh-CN">ZH</option>
        </select>

        <!-- Voice Typing Button -->
        <button id="mic-btn" class="mic-button" title="Voice Typing (F8)" aria-label="Voice typing">
          <div class="mic-wave" id="mic-wave"></div>
          <svg class="mic-icon" id="mic-icon" viewBox="0 0 24 24" width="22" height="22">
            <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <!-- Shown instead of the mic glyph while recording; heights follow the live audio level. -->
          <div class="mic-levels" id="mic-levels" aria-hidden="true">
            <span class="level-bar"></span>
            <span class="level-bar"></span>
            <span class="level-bar"></span>
            <span class="level-bar"></span>
          </div>
          <!-- Small clock badge: the microphone stops by itself after silence. -->
          <svg class="mic-mode-badge" id="mic-mode-badge" viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="#202124" stroke="#8ab4f8" stroke-width="2.5"/>
            <path d="M12 7.5V12l3 2" fill="none" stroke="#8ab4f8" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Compact / Expand toggle button -->
        <button id="minimize-btn" class="header-action-btn" title="Toggle Compact Floating Mode">
          <svg id="compact-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" fill-rule="evenodd" d="M9 4h6a8 8 0 0 1 8 8 8 8 0 0 1-8 8H9a8 8 0 0 1-8-8 8 8 0 0 1 8-8zm0 2a6 6 0 0 0-6 6 6 6 0 0 0 6 6h6a6 6 0 0 0 6-6 6 6 0 0 0-6-6H9z"/>
            <g transform="translate(6 6.25) scale(0.5)">
              <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </g>
          </svg>
        </button>

        <!-- Minimize / Hide to Taskbar button -->
        <button id="hide-btn" class="header-action-btn" title="Minimize to Taskbar / System Tray">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M19 13H5v-2h14v2z"/>
          </svg>
        </button>

        <!-- Close button -->
        <button id="close-btn" class="header-action-btn close-btn" title="Quit VoxKey">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Keyboard Body -->
    <div class="keyboard-body" id="keyboard-body">
      <!-- Row 1 -->
      <div class="keyboard-row" id="row-1"></div>
      <!-- Row 2 -->
      <div class="keyboard-row" id="row-2"></div>
      <!-- Row 3 -->
      <div class="keyboard-row" id="row-3"></div>
      <!-- Row 4 -->
      <div class="keyboard-row" id="row-4"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
