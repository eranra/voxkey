<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>About VoxKey</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1f24;
        --panel: #25262c;
        --text: #e9eaee;
        --muted: #9a9ca6;
        --accent: #6ea8ff;
        --line: #33353a;
        --good: #9be3a2;
        font-family: -apple-system, 'Segoe UI', system-ui, Roboto, sans-serif;
        font-size: 13px;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(ellipse at 50% 18%, #2c3040 0%, var(--bg) 65%);
        color: var(--text);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px 22px 18px;
        box-sizing: border-box;
      }
      img.logo {
        width: 88px;
        height: 88px;
        margin-bottom: 10px;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
      }
      .tagline {
        margin: 4px 0 12px;
        color: var(--muted);
      }
      .version {
        font-size: 14px;
        font-weight: 600;
      }
      .details {
        margin: 2px 0 12px;
        color: var(--muted);
        font-size: 11px;
        user-select: text;
      }
      .status {
        min-height: 18px;
        margin-bottom: 10px;
      }
      .status.new {
        color: var(--good);
        font-weight: 600;
      }
      .buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 14px;
      }
      button {
        font: inherit;
        color: #0f1420;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 6px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .links {
        display: flex;
        gap: 14px;
        justify-content: center;
      }
      .links a {
        color: var(--accent);
        text-decoration: none;
        cursor: pointer;
      }
      .links a:hover {
        text-decoration: underline;
      }
      .small {
        margin-top: auto;
        padding-top: 12px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../assets/icon.png" alt="" />
    <h1>VoxKey</h1>
    <p class="tagline">On-screen keyboard with voice typing, for Windows and macOS.</p>
    <div class="version" id="version"></div>
    <div class="details" id="details"></div>
    <div class="status" id="status" role="status"></div>
    <div class="buttons">
      <button id="check">Check for Updates</button>
    </div>
    <div class="links">
      <a data-link="repo">GitHub</a>
      <a data-link="releases">Release Notes</a>
      <a data-link="issues">Report a Problem</a>
    </div>
    <div class="small" id="license"></div>
    <script src="about.js"></script>
  </body>
</html>
